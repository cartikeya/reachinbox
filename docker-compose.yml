services:
  mysql:
    image: mysql:8.4
    container_name: reachinbox-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reachinbox
      MYSQL_USER: reachinbox
      MYSQL_PASSWORD: reachinbox
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - reachinbox_mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - reachinbox_redisdata:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: reachinbox-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - reachinbox_esdata:/usr/share/elasticsearch/data

volumes:
  reachinbox_mysql_data:
  reachinbox_redisdata:
  reachinbox_esdata:
